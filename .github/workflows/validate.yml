name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux zsh
      - name: Validate shell script
        run: |
          bash -n setup.sh
          shellcheck setup.sh
          ./setup.sh --dry-run --no-docker --no-chrome --no-system-upgrade --no-nvidia
      - name: Validate shell configurations
        run: |
          zsh -n zsh/.zshrc zsh/.zshenv zsh/.zsh_aliases
          bash -n bash/.bashrc bash/.bash_aliases
      - name: Validate tmux configuration
        run: |
          tmux -L dotfiles-ci -f tmux/.tmux.conf new-session -d -s validation
          tmux -L dotfiles-ci kill-server
      - name: Check release assets and checksums
        run: python3 scripts/check-releases.py
